<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church of Light and Sound</title>
    <meta name="description" content="Church of Light and Sound official website.">
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f3ea;
            --fg: #1e1a17;
            --accent: #8b5e34;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--fg);
            background:
                radial-gradient(circle at top, #fff9f0 0%, var(--bg) 52%, #ece1d2 100%);
        }

        main {
            max-width: 42rem;
            padding: 4rem 2rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 0.95;
            letter-spacing: 0.04em;
        }

        p {
            margin: 0;
            font-size: 1.125rem;
            line-height: 1.7;
        }

        .eyebrow {
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-size: 0.75rem;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">Church of Light and Sound</div>
        <h1>Light, sound, and a quiet place to begin.</h1>
        <p>This site is the starting point for churchoflightandsound.net.</p>
    </main>
</body>
</html>
