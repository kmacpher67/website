# churchoflightandsound.net nginx config
server {
    listen 80;
    server_name churchoflightandsound.net www.churchoflightandsound.net;
    root /var/www/churchoflightandsound.net;
    index index.html index.htm;

    access_log /var/log/nginx/churchoflightandsound.net.access.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
