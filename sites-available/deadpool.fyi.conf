log_format deadpool.fyi '$remote_addr - $remote_user [$time_local]  $status ' '"$host" "$request" $body_bytes_sent "$http_referer" ';

server {
    listen 80;
    # listen [::]:80;

    server_name deadpool.fyi www.deadpool.fyi;
    root /var/www/deadpool.fyi;
    index index.html index.htm;

    access_log /var/log/nginx/deadpool.fyi.access.log deadpool.fyi;

    location / {
        try_files $uri $uri/ =404;
    }

}
